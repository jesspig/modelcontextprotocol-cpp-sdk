# C++ SDK 官方 conformance 已知偏差基线（未知版本回退默认）。
# per-leg 拆分：baseline-2025-11-25.yaml（legacy leg）与 baseline-2026-07-28.yaml（modern leg）；
# 选用规则见 scripts/run-conformance.sh（按 CONFORMANCE_SPEC_VERSION 映射，未知版本回退本文件）。
# 本文件仅作回退默认，各 leg 真源以对应 per-leg 文件为准；跨 leg 条目改动须同步，禁止只改一处。
#
# 驱动包：@modelcontextprotocol/conformance@0.2.0-alpha.12（alpha 通道最新，
# 2026-10-01；requirements 内核与 alpha.11 一致，升级只收 referee 修补）。
# 升级 referee 版本时须在同一变更里对账本文件——新增场景按实际结果
# 决定是否入基线，绝不预先臆测。
#
# 退出码语义（referee 保证，CI 不得用 continue-on-error 替代本机制）：
#   失败 + 在基线   -> exit 0（已知偏差，放行）
#   失败 + 不在基线 -> exit 1（真回归，job 变红）
#   通过 + 在基线   -> exit 1（过期条目，必须删除——实现落地后基线只减不增）
#   通过 + 不在基线 -> exit 0
#   本 leg 未运行的场景：其条目被容忍（不会误判过期）。
#
# 本地复现：scripts/run-conformance.sh server|client
#   CONFORMANCE_SPEC_VERSION=2025-11-25（默认，有状态 legacy leg）
#   CONFORMANCE_SPEC_VERSION=2026-07-28（stateless modern leg，
#   以 --requirements 2026-07-28 运行 50 场景 canonical 集）
#
# 双 era 说明：conformance-server 以 --stateless 切换双模式。
# 有状态模式固定 --spec-version 2025-11-25（initialize 握手）；
# stateless 模式跑 --requirements 2026-07-28（per-request _meta）。
# skills/tasks/sse-retry 等扩展场景默认被 referee skip（extension 不在
# active 适用集内），只在 --suite all / --force 下 run for visibility。
#
# 2026-10-29 复跑实测（referee 0.2.0-alpha.12）：
#   server modern 197 passed / 0 failed / 0 warnings，其中 server-stateless 场景
#   30/0/0 warnings（listen 成功响应不再追加空 result、客户端以 acknowledged 完成
#   订阅后校验数由 28 增至 30）；据此删除 server-stateless 条目，modern leg 基线清空。
#   server legacy 67 passed / 0 failed（同日四 leg 实测）；client modern 450 passed
#   / 9 failed（9 项均为本地无 OpenSSL 的 DPoP/ES256 环境限制：
#   auth/client-credentials-jwt、auth/dpop、auth/dpop-nonce，不新增基线）；
#   client legacy 233 passed / 0 failed。
# 据此删除 auth/client-credentials-basic、auth/enterprise-managed-authorization、
# auth/wif-jwt-bearer（modern 实测均 passed）。
#
# 跨 leg 保留条目（有证据，禁删）：
#   - server-sse-multiple-streams：modern 2/2 与 legacy 单跑 2/2 曾构成删除证据，
#     已删；后发现 legacy suite 内 skip 以 WARNING 记账，无条目 legacy 退出 1，
#     故恢复。该条目为 legacy 保绿所必需；modern leg 使用
#     baseline-2026-07-28.yaml（无本条目），不会判过期。
#
# 已删条目归因（删前均有 referee 变绿证据，禁恢复）：
#   - tools-call-with-progress：双因——其一传输未开 GET 流
#     广播无人收（enable_legacy_sse=true 修好 logging/sampling/
#     elicitation 系列），其二 _meta 反序列化剥离后 Params().meta
#     恒空（fixture 改读 GetRequest().meta 取 progressToken，
#     同法修好 LoggingTool 的 logLevel 门控）。legacy leg 2/2 变绿故删；
#     modern leg 2026-10-29 复跑实测亦已通过，不另设条目。
#   - sse-retry（SEP-1699，legacy client scored）：2026-10-11 Windows
#     本地 alpha.12 单跑 3/3（POST 中断后 resume GET 带 Last-Event-ID
#     event-2、2 次 GET 连接、实际延迟 559ms∈[450,700]），referee 报
#     stale，故删。生产侧为 G8b：POST SSE 过早 EOF 后按钳制延迟重建
#     GET 并把原 ID 结果递回 pending，失败仍走 G8 fail-fast。
#     2026-10-12 core leg（2025）复跑再确认 3/3，禁恢复。
#   - http-standard-headers（9/0）、http-invalid-tool-headers（12/0）：
#     2026-10-11 --requirements 2026-07-28 实测全过，2026-10-12 复跑仍全绿，
#     禁恢复。
#   - sep-2322-client-request-state：2026-10-11 以 5/0 删除；2026-10-12
#     --requirements 复跑 0/5 使删除证据作废；2026-10-29 client modern
#     450/9（失败全为 auth）未再出现本场景失败，保持删除，禁恢复。
#   - elicitation-sep1034-client-defaults：G 批实现 applyDefaults（7 单测
#     守护）后删除；2026-10-12 core leg（2025）复跑 0/5，疑 fixture 未声明
#     applyDefaults 致回填短路（推测）；2026-10-29 client legacy 233/0 已
#     全绿，保持删除，禁恢复。
#   - json-schema-ref-no-deref：2026 requirements 集内新场景，2026-10-12
#     复跑 0/1 unexpected，未入基线；2026-10-29 client modern 450/9（失败
#     全为 auth）未再出现本场景失败，按基线只减不增保持不入基线。
#   - auth 已删条目（metadata-default、basic-cimd、scope×5、token-endpoint×3、
#     pre-registration、resource-mismatch、offline-access×2、
#     authorization-server-migration、iss×6、metadata-issuer-mismatch、
#     metadata-var1/var2/var3、scope-step-up、client-credentials-jwt、
#     dpop、dpop-nonce）均在 referee 报 stale 或 Linux+OpenSSL 实测
#     checks.json 全 SUCCESS 后删除，禁恢复。
#   - 2026-10-29 新增删除 3 条：auth/client-credentials-basic、
#     auth/enterprise-managed-authorization、auth/wif-jwt-bearer（依据见上）。
#   - 2026-10-29 复跑再删 1 条：server-stateless（30/0/0 warnings，listen 成功
#     响应不再追加空 result、客户端以 acknowledged 完成订阅，modern server 全绿）。
#
# client 侧遗留说明：http-custom-headers 仅 legacy leg 保留，条目真源见
# baseline-2025-11-25.yaml；Windows 非 ASCII context 致 JsonValue::Parse 报
# invalid UTF-8，Linux CI（UTF-8 locale）预期通过。2026-10-29 client legacy
# 233/0 中本场景未运行，保留待复跑，故本文件 client 段不设该条目。

server:
    # --- server-sse-multiple-streams（跨 leg 保留，见上）---
    # 旧“传输层多流能力缺口”归因为推断错误。实测有 session 时 3 并发
    # POST 全 200 全 SSE（legacy 单跑 2/2，modern 2/2）。
    # suite 内保持 skip：fixture 若发 session 会激活 lifecycle DELETE，
    # 而单通道传输的 DELETE 关闭共享 channel 毒化后续全场景（生产缺口），
    # 故 stateful fixture 显式不设 session_store。
    - server-sse-multiple-streams

client: []
