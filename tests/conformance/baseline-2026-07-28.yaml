# per-leg 基线：modern leg（CONFORMANCE_SPEC_VERSION=2026-07-28）。
# 来源：tests/conformance/baseline.yaml（2026-10-12 摘录，条目逐字一致）。
# 选用规则：scripts/run-conformance.sh 按 CONFORMANCE_SPEC_VERSION 映射本文件，
# 未知版本回退 tests/conformance/baseline.yaml。完整归因见 baseline.yaml，本文件只收
# modern leg（--requirements 2026-07-28）实际运行的场景条目（server 0 + client 32）。

# （server 键：仅 server-stateless 一条。server-sse-multiple-streams 在 modern requirements 内 2/2 通过，
# 故不入本文件（入则报 stale）；该条目仅留 baseline-2025-11-25.yaml 保 legacy 绿。）

server:
    # --- server-stateless（SHOULD 级推送缺口，modern leg 保绿）---
    # 2026-10-12 referee 实测 28/28 通过但带 2 个 WARNING
    # （ServerSendsPromptsListChangedOnSubscription 与
    # ServerSendsToolsListChangedOnSubscription，均为 SHOULD 级：
    # 诊断工具变更列表后 listen 流未收到 list_changed 推送），
    # referee 将其判为 unexpected 致 modern server leg 退出 1。
    # 待生产实现变更推送后 referee 会报 stale，届时删除本条目。
    - server-stateless

client:
    # --- http-custom-headers（Windows 本地失败，Linux 待复核）---
    # fixture 有对应场景注册且逻辑正确（列工具→按 context 逐个调用），
    # 但 Windows 下 MCP_CONFORMANCE_CONTEXT 经 getenv 取回时非 ASCII
    # （世界）与字面控制字符致 JsonValue::Parse 报 invalid UTF-8，
    # client 退出 1。CI Linux（UTF-8 locale）下预期通过；若 CI modern
    # invocation 报本条目 stale，即为变绿证据，届时删除。
    # 旧“fetch-shim/注入点依赖”归因错误：context 系经环境变量下发，
    # C++ fixture 可读，无需 TS fetch shim。
    - http-custom-headers

    # --- auth/*（C++ client 无 OAuth 表面，全部 untestable）---
    # 注意旧注释“core 不选择 auth”已证伪：core/active 逐个运行 auth
    # 场景，client 以 Unknown scenario 退出 1，靠本基线放行。
    # requirements 集共 31 个 auth 场景（2026 requirements 新增 11 个：
    # resource-mismatch、offline-access-scope、offline-access-not-supported、
    # authorization-server-migration、iss-supported、iss-not-advertised、
    # iss-supported-missing、iss-wrong-issuer、iss-unexpected、
    # iss-normalized、metadata-issuer-mismatch），C++ 侧同样无表面，
    # 同样 unknown 退出 1。2026-10-12 复跑输出中 expected 命中 25 auth +
    # http-custom-headers；另 6 个新 auth（client-credentials-jwt/basic、
    # enterprise-managed-authorization、dpop、dpop-nonce、wif-jwt-bearer）
    # 同样 unknown 退出 1，终判 unexpected 仅 sep-2322 与
    # json-schema-ref-no-deref 两项（见上），与 auth 无关。
    # 待 OAuth client 表面落地（生产）或 referee 收敛后重审。
    - auth/metadata-default
    - auth/metadata-var1
    - auth/metadata-var2
    - auth/metadata-var3
    - auth/basic-cimd
    - auth/scope-from-www-authenticate
    - auth/scope-from-scopes-supported
    - auth/scope-omitted-when-undefined
    - auth/scope-step-up
    - auth/scope-retry-limit
    - auth/token-endpoint-auth-basic
    - auth/token-endpoint-auth-post
    - auth/token-endpoint-auth-none
    - auth/pre-registration
    - auth/resource-mismatch
    - auth/offline-access-scope
    - auth/offline-access-not-supported
    - auth/authorization-server-migration
    - auth/iss-supported
    - auth/iss-not-advertised
    - auth/iss-supported-missing
    - auth/iss-wrong-issuer
    - auth/iss-unexpected
    - auth/iss-normalized
    - auth/metadata-issuer-mismatch
    - auth/client-credentials-jwt
    - auth/client-credentials-basic
    - auth/enterprise-managed-authorization
    - auth/dpop
    - auth/dpop-nonce
    - auth/wif-jwt-bearer
