# per-leg 基线：modern leg（CONFORMANCE_SPEC_VERSION=2026-07-28）。
# 来源：tests/conformance/baseline.yaml（2026-10-12 摘录，条目逐字一致）。
# 选用规则：scripts/run-conformance.sh 按 CONFORMANCE_SPEC_VERSION 映射本文件，
# 未知版本回退 tests/conformance/baseline.yaml。完整归因见 baseline.yaml，本文件只收
# modern leg（--requirements 2026-07-28）实际运行的场景条目（server 1 + client 10）。

# （server 键：仅 server-stateless 一条。server-sse-multiple-streams 在 modern requirements 内 2/2 通过，
# 故不入本文件（入则报 stale）；该条目仅留 baseline-2025-11-25.yaml 保 legacy 绿。）

server:
    # --- server-stateless（SHOULD 级推送缺口，modern leg 保绿）---
    # 2026-10-12 referee 实测 28/28 通过但带 2 个 WARNING
    # （ServerSendsPromptsListChangedOnSubscription 与
    # ServerSendsToolsListChangedOnSubscription，均为 SHOULD 级：
    # 诊断工具变更列表后 listen 流未收到 list_changed 推送），
    # referee 将其判为 unexpected 致 modern server leg 退出 1。
    # 待生产实现变更推送后 referee 会报 stale，届时删除本条目。
    - server-stateless

client:
    # --- auth/*（C++ client 无 OAuth 表面，全部 untestable）---
    # 注意旧注释“core 不选择 auth”已证伪：core/active 逐个运行 auth
    # 场景，client 以 Unknown scenario 退出 1，靠本基线放行。
    # 2026-10-13 A-T2 fixture 真实流联调后 21 条目转绿删除（referee stale 证据，
    # modern leg 383 passed）：metadata-default、basic-cimd、scope×5、
    # token-endpoint×3、pre-registration、resource-mismatch、
    # offline-access-scope、offline-access-not-supported、iss×6（含 normalized）、
    # metadata-issuer-mismatch。保留：metadata-var1/var3 与 migration（部分失败）、
    # metadata-var2、cc-jwt、dpop×2（全败，生产缺口记账）、cc-basic、enterprise、
    # wif（0 failed 但 referee 未标 stale，暂留待追标）。
    # 旧注记（2026-10-12，全 unknown 时代）已过时，留档至此：
    # requirements 集 31 auth 当时靠本基线放行；A-T2 后 fixture 走真实流，
    # 仅上列保留条目仍失败，其余转绿删除。
    - auth/metadata-var1
    - auth/metadata-var2
    - auth/metadata-var3
    - auth/authorization-server-migration
    - auth/client-credentials-jwt
    - auth/client-credentials-basic
    - auth/enterprise-managed-authorization
    - auth/dpop
    - auth/dpop-nonce
    - auth/wif-jwt-bearer
