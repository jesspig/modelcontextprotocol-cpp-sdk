name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build_type: debug
            openssl: auto
            openssl_major: 3
          - os: windows-2022
            build_type: release
            openssl: auto
            openssl_major: 3
          - os: ubuntu-24.04
            build_type: debug
            openssl: auto
            openssl_major: 3
          - os: ubuntu-24.04
            build_type: release
            openssl: auto
            openssl_major: 3
          - os: ubuntu-24.04
            build_type: debug
            compiler: gcc
            openssl: auto
            openssl_major: 3
          - os: ubuntu-24.04
            build_type: release
            compiler: gcc
            openssl: auto
            openssl_major: 3
          - os: macos-15
            build_type: debug
            openssl: auto
            openssl_major: 4
          - os: macos-15
            build_type: release
            openssl: auto
            openssl_major: 3
          - os: windows-2022
            build_type: debug
            openssl: off
          - os: ubuntu-24.04
            build_type: debug
            openssl: off
          - os: macos-15
            build_type: debug
            openssl: off

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set SCCACHE_DIR
        shell: bash
        run: echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler || 'clang' }}-${{ matrix.openssl }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler || 'clang' }}-
            sccache-${{ matrix.os }}-

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS' && matrix.openssl != 'off'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          formula="openssl@${{ matrix.openssl_major }}"
          brew install "$formula"
          echo "OPENSSL_PREFIX=$(brew --prefix "$formula")" >> "$GITHUB_ENV"

      - name: Configure (Linux)
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DCMAKE_CXX_COMPILER=g++ -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'ON' }} -DMCP_OPENSSL_EXPECTED_MAJOR=${{ matrix.openssl_major }}
          else
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'ON' }} -DMCP_OPENSSL_EXPECTED_MAJOR=${{ matrix.openssl_major }}
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslDir = Get-ChildItem 'C:\Program Files' -Directory -Filter 'OpenSSL*' | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $opensslDir) {
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'ON' }} -DMCP_OPENSSL_EXPECTED_MAJOR=${{ matrix.openssl_major }}
          } else {
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON "-DOPENSSL_ROOT_DIR=$($opensslDir.FullName)" -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'ON' }} -DMCP_OPENSSL_EXPECTED_MAJOR=${{ matrix.openssl_major }}
          }

      - name: Configure (macOS, OpenSSL on)
        if: runner.os == 'macOS' && matrix.openssl != 'off'
        run: cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DOPENSSL_ROOT_DIR="$OPENSSL_PREFIX" -DMCP_WITH_OPENSSL=ON -DMCP_OPENSSL_EXPECTED_MAJOR=${{ matrix.openssl_major }}

      - name: Configure (macOS, OpenSSL off)
        if: runner.os == 'macOS' && matrix.openssl == 'off'
        run: cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=OFF

      - name: Verify OpenSSL version gate
        if: runner.os == 'Linux' && matrix.build_type == 'debug' && matrix.compiler != 'gcc'
        run: |
          cmake -DOPENSSL_VERSION=3.0.13 -P scripts/check-openssl-version.cmake
          cmake -DOPENSSL_VERSION=4.0.3 -P scripts/check-openssl-version.cmake
          cmake -DOPENSSL_VERSION=4.1.0 -P scripts/check-openssl-version.cmake
          if cmake -DOPENSSL_VERSION=5.0.0 -P scripts/check-openssl-version.cmake; then
            exit 1
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Build examples
        if: runner.os == 'Linux' && matrix.build_type == 'debug' && matrix.compiler != 'gcc'
        run: |
          cmake --preset debug -DMCP_BUILD_EXAMPLES=ON
          cmake --build --preset debug --target EchoServer WeatherServer SimpleClient

      - name: Compat smoke
        if: runner.os == 'Linux' && matrix.build_type == 'debug' && matrix.compiler != 'gcc'
        run: cmake --build --preset debug --target mcp-compat-smoke

  sanitize:
    name: sanitize (asan+ubsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure
        run: cmake --preset debug -DMCP_WERROR=ON -DMCP_SANITIZE=address -DMCP_WITH_OPENSSL=OFF -B build/asan

      - name: Build
        run: cmake --build build/asan

      - name: Test
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan --output-on-failure --timeout 300

  tsan:
    name: sanitize (tsan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure
        run: cmake --preset debug -DMCP_WERROR=ON -DMCP_SANITIZE=thread -DMCP_WITH_OPENSSL=OFF -B build/tsan

      - name: Build
        run: cmake --build build/tsan

      - name: Test
        env:
          TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=1
        run: >-
          ctest --test-dir build/tsan --output-on-failure --timeout 300
          -R "Transport|HttpClient|TcpSocket|StreamableHttp|SessionHandler"

  install-consumer:
    name: install consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Configure
        run: cmake --preset debug -DMCP_BUILD_TESTS=OFF -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=OFF

      - name: Build
        run: cmake --build --preset debug

      - name: Install
        run: cmake --install build/debug --prefix "${{ github.workspace }}/install-prefix"

      - name: Build consumer
        run: |
          consumer_dir="${{ runner.temp }}/mcp-consumer"
          mkdir -p "$consumer_dir"
          cat > "$consumer_dir/CMakeLists.txt" <<'CONSUMER_CMAKE'
          cmake_minimum_required(VERSION 3.28)
          project(mcp-consumer LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          find_package(mcp REQUIRED)

          add_executable(mcp-consumer main.cpp)
          target_link_libraries(mcp-consumer PRIVATE mcp::mcp-client)
          CONSUMER_CMAKE
          cat > "$consumer_dir/main.cpp" <<'CONSUMER_MAIN'
          #include <mcp/McpVersion.hpp>
          #include <mcp/client/McpClient.hpp>

          #include <cstdio>
          #include <string>

          int main() {
              std::printf("%s\n", std::string(mcp::kSdkVersion).c_str());
              auto create = &mcp::McpClient::Create;
              return create ? 0 : 1;
          }
          CONSUMER_MAIN
          cmake -S "$consumer_dir" -B "$consumer_dir/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix"
          cmake --build "$consumer_dir/build"
