name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            build_type: debug
            openssl: auto
          - os: windows-2022
            build_type: release
            openssl: auto
          - os: ubuntu-24.04
            build_type: debug
            openssl: auto
          - os: ubuntu-24.04
            build_type: release
            openssl: auto
          - os: ubuntu-24.04
            build_type: debug
            compiler: gcc
            openssl: auto
          - os: ubuntu-24.04
            build_type: release
            compiler: gcc
            openssl: auto
          - os: macos-15
            build_type: debug
            openssl: auto
          - os: macos-15
            build_type: release
            openssl: auto
          - os: windows-2022
            build_type: debug
            openssl: off
          - os: ubuntu-24.04
            build_type: debug
            openssl: off
          - os: macos-15
            build_type: debug
            openssl: off

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Set SCCACHE_DIR
        shell: bash
        run: echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Cache sccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler || 'clang' }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.compiler || 'clang' }}-
            sccache-${{ matrix.os }}-

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install openssl

      - name: Configure (Linux)
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DCMAKE_CXX_COMPILER=g++ -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'AUTO' }}
          else
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'AUTO' }}
          fi

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslDir = Get-ChildItem 'C:\Program Files' -Directory -Filter 'OpenSSL*' | Sort-Object Name -Descending | Select-Object -First 1
          if ($null -eq $opensslDir) {
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'AUTO' }}
          } else {
            cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON "-DOPENSSL_ROOT_DIR=$($opensslDir.FullName)" -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'AUTO' }}
          }

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake --preset ${{ matrix.build_type }} -DMCP_WERROR=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)" -DMCP_WITH_OPENSSL=${{ matrix.openssl == 'off' && 'OFF' || 'AUTO' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: Test
        run: ctest --preset ${{ matrix.build_type }} --output-on-failure --timeout 120
