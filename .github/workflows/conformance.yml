name: Conformance

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFORMANCE_PACKAGE: '@modelcontextprotocol/conformance@0.2.0-alpha.12'
  CONFORMANCE_BASELINE: tests/conformance/baseline.yaml

jobs:
  server:
    name: conformance server (${{ matrix.spec }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec: ['2025-11-25', '2026-07-28']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure
        run: cmake --preset debug -DMCP_BUILD_CONFORMANCE=ON -DMCP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset debug --target conformance-server

      - name: Install conformance referee
        run: npm install -g "$CONFORMANCE_PACKAGE"

      - name: Run official conformance suite (server)
        shell: bash
        env:
          CONFORMANCE_SPEC_VERSION: ${{ matrix.spec }}
        run: |
          set -e
          PORT=3010
          SERVER_URL="http://localhost:${PORT}/mcp"
          SERVER_BIN="${GITHUB_WORKSPACE}/build/debug/examples/conformance/server/conformance-server"

          # 与 scripts/run-conformance.sh 一致：端口被占时拒跑，防止对残留
          # 旧进程做 conformance 得出假结论。
          if (: > "/dev/tcp/localhost/${PORT}") 2>/dev/null; then
              echo "Error: port ${PORT} is already in use."
              exit 1
          fi

          if [ "${CONFORMANCE_SPEC_VERSION}" = "2026-07-28" ]; then
              SERVER_ARGS="--stateless"
              SPEC_ARGS="--requirements 2026-07-28"
              PROBE_BODY='{"jsonrpc":"2.0","id":0,"method":"server/discover","params":{}}'
          else
              SERVER_ARGS=""
              SPEC_ARGS="--spec-version ${CONFORMANCE_SPEC_VERSION}"
              PROBE_BODY='{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"'${CONFORMANCE_SPEC_VERSION}'","capabilities":{},"clientInfo":{"name":"probe","version":"1.0"}}}'
          fi

          "${SERVER_BIN}" --port "${PORT}" ${SERVER_ARGS} &
          SERVER_PID=$!
          cleanup() {
              kill "${SERVER_PID}" 2>/dev/null || true
              wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for conformance server to be ready..."
          MAX_RETRIES=30
          RETRY_COUNT=0
          # legacy 选 initialize：有状态模式必有 JSON 应答；POST 探测不会像
          # GET 一样建立 SSE 长流导致 --max-time 误超时。modern 选 discover：
          # initialize 在 2026 时代已被移除，discover 兼作 liveness 探测
          #（400/200 皆证明 HTTP 可达，curl 无 --fail 时均判就绪）。
          probe_ready() {
              curl -s --max-time 2 -X POST "${SERVER_URL}" \
                  -H "Content-Type: application/json" \
                  -H "Accept: application/json, text/event-stream" \
                  -d "${PROBE_BODY}" \
                  > /dev/null 2>&1
          }
          while ! probe_ready; do
              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
                  echo "Server process exited unexpectedly"
                  exit 1
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ "${RETRY_COUNT}" -ge "${MAX_RETRIES}" ]; then
                  echo "Server failed to start after ${MAX_RETRIES} attempts"
                  exit 1
              fi
              sleep 0.5
          done

          echo "Server is ready. Running conformance tests..."
          conformance server --url "${SERVER_URL}" \
              ${SPEC_ARGS} \
              --expected-failures "${CONFORMANCE_BASELINE}" \
              --verbose

  client:
    name: conformance client (${{ matrix.spec }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        spec: ['2025-11-25', '2026-07-28']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure
        run: cmake --preset debug -DMCP_BUILD_CONFORMANCE=ON -DMCP_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build --preset debug --target conformance-client

      - name: Install conformance referee
        run: npm install -g "$CONFORMANCE_PACKAGE"

      # client 模式由 referee 自带 per-scenario test server 驱动 C++ client
      # （URL 作 argv[1]，场景名经 MCP_CONFORMANCE_SCENARIO 下发），无需 TS
      # SDK 源码与 tsx。
      - name: Run official conformance suite (client)
        shell: bash
        env:
          CONFORMANCE_SPEC_VERSION: ${{ matrix.spec }}
        run: |
          set -e
          CLIENT_BIN="${GITHUB_WORKSPACE}/build/debug/examples/conformance/client/conformance-client"
          if [ "${CONFORMANCE_SPEC_VERSION}" = "2026-07-28" ]; then
              conformance client --command "${CLIENT_BIN}" \
                  --requirements 2026-07-28 \
                  --expected-failures "${CONFORMANCE_BASELINE}" \
                  --verbose
          else
              conformance client --command "${CLIENT_BIN}" \
                  --suite core \
                  --spec-version "${CONFORMANCE_SPEC_VERSION}" \
                  --expected-failures "${CONFORMANCE_BASELINE}" \
                  --verbose
          fi
